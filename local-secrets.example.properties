# Copy this file to local-secrets.properties (git-ignored) and fill in the values.
# infrastructure/windows/setup-postgresql.ps1 fills the PostgreSQL entries for you.

# New gps_tracking PostgreSQL database - password of the gps_app login
spring.datasource.password=

# Existing smart_truck MySQL database (read-only source) - same values as DB_USER / DB_PASSWORD in smart-truck/.env
smart-truck.database.username=
smart-truck.database.password=

# Written by setup-postgresql.ps1: password of the local PostgreSQL superuser "postgres" (not used by the service)
local.postgres.superuser.password=
