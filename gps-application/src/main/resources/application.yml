# GPS streaming service configuration.
# Passwords are NOT kept here: they are read from local-secrets.properties (git-ignored),
# see local-secrets.example.properties for the expected keys.

server:
  port: 8080

spring:
  application:
    name: gps-streaming-service
  config:
    # Works whether the service is started from the project root or from the gps-application folder.
    import: optional:file:./local-secrets.properties,optional:file:../local-secrets.properties

  # The NEW database owned by this service (PostgreSQL). Tables come from Flyway (db/migration).
  datasource:
    url: jdbc:postgresql://localhost:5432/gps_tracking
    username: gps_app
  jpa:
    open-in-view: false
    hibernate:
      # Flyway creates the tables; Hibernate only checks that the entities match them.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    admin:
      # Bring EXISTING topics in line with their declaration at every start (retention 7 days -> 31, min in-sync ...).
      modify-topic-configs: true
    producer:
      # No acknowledged record is ever lost by a producer:
      #   acks=all            "ok" only once every in-sync copy has the record
      #   idempotence         a retry never writes a record twice, and order per partition is kept
      #   retries / timeout   retry inside the client for 5 minutes; after that the ingest journal keeps the record
      #   max.block.ms        do not hang a caller for a minute when Kafka is down: fail fast, the journal has it
      #   zstd                a month of JSON takes a fraction of the disk
      acks: all
      retries: 2147483647
      compression-type: zstd
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
        delivery.timeout.ms: 300000
        max.block.ms: 5000
        linger.ms: 5
    consumer:
      # A brand-new consumer group starts from the oldest message instead of only new ones.
      auto-offset-reset: earliest
      # The Kafka Streams normalizer writes in transactions (exactly-once): read only what was committed,
      # never the records of a transaction it had to abort.
      isolation-level: read_committed

  # The dashboard page changes with every release: make browsers always ask for the current version.
  web:
    resources:
      cache:
        cachecontrol:
          no-cache: true

  # Redis: latest position of every vehicle + engine load counters (browse with RedisInsight).
  data:
    redis:
      host: localhost
      port: 6379

# The EXISTING smart_truck MySQL database - read-only source of real GPS pings.
smart-truck:
  database:
    url: jdbc:mysql://localhost:3306/smart_truck

gps:
  # How a raw frame travels through the service:
  #   kafka  : frame -> Kafka -> processing consumer -> Kafka -> storage consumer -> PostgreSQL  (needs Kafka running)
  #   direct : frame -> processing -> PostgreSQL in one call, no Kafka at all                    (Kafka may be stopped)
  # Override at start-up:  --gps.processing-flow=direct
  processing-flow: kafka
  simulator:
    vehicle-count: 150
    pings-per-vehicle: 500
    minimum-pings-per-trip: 200
    # Re-stamp the trips around the current time and keep driving them back and forth, so data keeps coming.
    replay-as-live: true
    repeat-forever: true
    start-when-application-starts: false
    # faithful: every ping keeps its real gap (about 1 minute in smart_truck), so speed from distance/time, the
    #           60-second over-speed rule, 3-minute stops and idling are real. The replay starts catch-up-minutes
    #           in the past and runs catch-up-speed-factor times faster until it reaches now, then real time
    #           (150 vehicles: about 75 frames/s while catching up, about 2.5 frames/s live).
    # compressed: the old way - one ping of every vehicle every delay-between-rounds-millis, stamped now.
    timing: faithful
    catch-up-minutes: 120
    catch-up-speed-factor: 30
    delay-between-rounds-millis: 2000
    # smart_truck has no ignition or odometer, so the simulator adds them for a share of the devices
    # (the rest exercise virtual ignition and GPS distance); idling drivers keep the engine on while standing.
    devices-with-ignition: 0.5
    devices-with-odometer: 0.5
    idling-devices: 0.25
  # Distance step (Traccar DistanceHandler + FilterHandler maxSpeed), see CalculateMovementStep.
  distance:
    jitter-meters: 10
    jitter-max-speed-kmph: 5
    max-implied-speed-kmph: 200
    min-jump-meters: 500
  # The four stream consumers after Kafka (speed violation, vehicle state, stoppage, ignition).
  # Speed rules are NOT here: they live in Redis (gps:config:speed-rule:*) and are edited from the UI or
  # PUT /api/speed/rules/{scope}; the default rule is created on first start.
  stream:
    history-length: 1000
    stoppage:
      radius-meters: 100
      min-duration-seconds: 180
      stationary-speed-kmph: 3
      exit-confirm-readings: 2
      max-gap-seconds: 1800
      merge-gap-seconds: 180
    ignition:
      virtual-off-after-seconds: 300
      idle-speed-kmph: 3
      idle-alert-seconds: 300
      virtual-debounce-readings: 2
    vehicle-state:
      gps-sigma-meters: 12
      acceleration-sigma: 1.5
    enrichment:
      weather-enabled: true
      weather-url: https://api.open-meteo.com/v1/forecast
      tomtom-api-key: ${TOMTOM_API_KEY:}
      traffic-radius-meters: 1000
      timeout-millis: 3000
  # Kafka: how long and how safely the platform's topics are kept (docs/DATA_SAFETY_GUIDE.md).
  #   retention              31 days on every platform topic: a full month of data stays in Kafka
  #   replication-factor     copies on different brokers: 1 with the single local broker, 3 with docker-compose.ha.yml
  #   min-insync-replicas    copies written before a producer hears "ok": 1 local, 2 in HA
  kafka:
    retention: 31d
    replication-factor: ${GPS_KAFKA_REPLICATION_FACTOR:1}
    min-insync-replicas: ${GPS_KAFKA_MIN_INSYNC_REPLICAS:1}
  # Ingest journal: device frames and vehicle events are fsynced to this folder BEFORE they are sent to Kafka, and stay
  # until Kafka confirms them - Kafka down, the service killed, a power cut: they are sent again, in order.
  # Docker: a volume (GPS_JOURNAL_DIRECTORY=/var/lib/gps-journal).
  journal:
    directory: ${GPS_JOURNAL_DIRECTORY:./data/ingest-journal}
    records-per-segment: 1000
    fsync-every-record: true
    drain-batch-size: 5000
  # Kafka Streams (Kafka flow only), see docs/KAFKA_STREAMS_GUIDE.md. Two apps run inside this service:
  #   normalizer : raw frames -> processed positions / rejections, exactly-once, state in RocksDB + changelog topics
  #   analytics  : processed positions -> vehicle KTable, 5-minute event-time windows (gps.vehicle-activity), parity
  # normalization - who turns raw frames into positions (one owner, never two):
  #   owner  : Kafka Streams; the @KafkaListener consumer is not created. It continues from the listener's offsets.
  #   shadow : the listener; Kafka Streams writes the same results to gps.shadow.* and GET /api/streams/parity
  #            compares both, reading by reading - validate here before switching to owner.
  #   off    : the listener; Kafka Streams only runs the analytics.
  # Read the state: GET /api/streams/overview, /api/streams/vehicles/{imei}, /api/streams/fleet/activity
  streams:
    enabled: true
    normalization: owner
    # one stream thread per partition, so each task has a thread of its own
    threads: 3
    # warm copies of every store on OTHER instances: 0 with one instance, 1 as soon as there are two
    standby-replicas: 0
    # internal changelog topics: -1 = the broker's default (1 here), 3 on a real cluster
    replication-factor: -1
    # where RocksDB keeps the stores (default: Kafka Streams' temp folder). Keep it on a volume - a restart then
    # reuses the local stores instead of replaying the changelogs. Docker: GPS_STREAMS_STATEDIR=/var/lib/gps-streams
    # state-dir: /var/lib/gps-streams
    # how other instances reach this one for Interactive Queries (application.server = host:server.port)
    advertised-host: localhost
    leave-group-on-close: true
    # ordering and duplicate policies of the normalizer (event time = the device's recordedAt)
    max-lateness: 24h
    seen-readings-retention: 24h
    # activity windows: size, how late a reading may still count, how long closed windows stay queryable
    window-size: 5m
    window-grace: 2m
    window-retention: 6h
    parity-grace: 2m
    rocksdb-off-heap-mb: 64
    normalizer-guarantee: exactly_once_v2
    analytics-guarantee: at_least_once
    # anything else, passed on to Kafka Streams as is, e.g. client.rack, rack.aware.assignment.tags
    properties: {}
  # "Empty DB" for demo practice (POST /api/admin/reset). Switch off anywhere that is not a demo.
  admin:
    reset-enabled: true
  # Trip and stop detection (consumer group gps-trip-service), Traccar's defaults:
  #   a trip starts once the vehicle is min-distance away from where it stopped,
  #   it stops when it stays within min-distance for min-duration,
  #   and a silence longer than stop-gap ends the trip at the last reading before the silence.
  trips:
    min-distance-meters: 200
    min-duration-seconds: 180
    stop-gap-seconds: 3600

# Log classification: every line shows WHICH stage wrote it, for WHICH device, from WHICH partition/offset:
#   WARN [stage=position-storage imei=0861000000000002 p=2 o=1534] ...
# Filter one device:   ... | Select-String "imei=0861000000000002"      one consumer: ... | Select-String "stage=live-location"
# Engine load summary every 30 s:  ... | Select-String "ENGINE"
# Per-message debug lines: set LOGGING_LEVEL_COM_SRM_GPS=DEBUG
logging:
  pattern:
    level: "%5p [stage=%X{stage:-none} imei=%X{imei:--} p=%X{partition:--} o=%X{offset:--}]"
  level:
    org.apache.kafka: WARN
    org.springframework.kafka: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      # http://localhost:8080/actuator/health also shows whether PostgreSQL ("db") is UP. Local development only.
      show-details: always
