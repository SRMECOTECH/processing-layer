# Three Kafka brokers instead of one: every record on 3 brokers, written to 2 before a producer hears "ok".
# A broker, or its disk, can be lost without losing a single acknowledged record - the one thing a single broker
# cannot promise. (Run the brokers on three machines in production; here they share one machine.)
#
#   Start:  docker compose -f docker-compose.yml -f docker-compose.ha.yml up -d --build
#   Stop:   docker compose -f docker-compose.yml -f docker-compose.ha.yml down
#
# The brokers use their own volumes (gps-kafka-ha-*): a single-broker KRaft log cannot join a 3-broker quorum, so
# this starts with empty topics. The service declares them with replication 3 and min.insync.replicas 2.
# Windows ports: localhost:29092, 29093, 29094.

x-kafka-ha: &kafka-ha
  KAFKA_PROCESS_ROLES: broker,controller
  CLUSTER_ID: 5L6g3nShT-eMCtK--X86sw
  KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093,2@kafka-2:9093,3@kafka-3:9093
  KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
  KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
  KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
  # three copies of everything, two written before "ok"
  KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
  KAFKA_DEFAULT_REPLICATION_FACTOR: 3
  KAFKA_MIN_INSYNC_REPLICAS: 2
  KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
  KAFKA_LOG_RETENTION_HOURS: 744
  KAFKA_LOG_RETENTION_BYTES: -1
  KAFKA_OFFSETS_RETENTION_MINUTES: 44640
  KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
  KAFKA_UNCLEAN_LEADER_ELECTION_ENABLE: "false"
  # replicated: durability comes from the other brokers, so the disk flush is left to the OS again (Kafka's default)
  KAFKA_LOG_FLUSH_INTERVAL_MESSAGES: 9223372036854775807
  KAFKA_LOG_DIRS: /var/lib/kafka/data

services:

  kafka:
    environment:
      <<: *kafka-ha
      KAFKA_NODE_ID: 1
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:29092
    volumes: !override
      - gps-kafka-ha-1:/var/lib/kafka/data

  kafka-2:
    image: apache/kafka:4.3.1
    restart: always
    environment:
      <<: *kafka-ha
      KAFKA_NODE_ID: 2
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:29093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-2:9092,EXTERNAL://localhost:29093
    ports:
      - "29093:29093"
    volumes:
      - gps-kafka-ha-2:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 20

  kafka-3:
    image: apache/kafka:4.3.1
    restart: always
    environment:
      <<: *kafka-ha
      KAFKA_NODE_ID: 3
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:29094
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-3:9092,EXTERNAL://localhost:29094
    ports:
      - "29094:29094"
    volumes:
      - gps-kafka-ha-3:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 20

  kafka-ui:
    environment:
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092,kafka-2:9092,kafka-3:9092

  gps-service:
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092,kafka-2:9092,kafka-3:9092
      GPS_KAFKA_REPLICATION_FACTOR: 3
      GPS_KAFKA_MIN_INSYNC_REPLICAS: 2
      GPS_STREAMS_REPLICATIONFACTOR: 3
    depends_on:
      kafka-2:
        condition: service_healthy
      kafka-3:
        condition: service_healthy

volumes:
  gps-kafka-ha-1:
  gps-kafka-ha-2:
  gps-kafka-ha-3:
